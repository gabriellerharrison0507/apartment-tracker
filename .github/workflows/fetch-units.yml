name: Fetch Unit Prices

on:
  schedule:
    - cron: '0 14 * * *'  # 8am MDT (UTC-6) daily
  workflow_dispatch:       # Allow manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install playwright playwright-stealth cloudscraper
          playwright install chromium
          playwright install-deps chromium

      - name: Fetch Lyra unit prices
        run: python fetch_units.py
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}

      - name: Fetch Henry unit prices
        run: python fetch_henry.py
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}

      - name: Fetch Modera unit prices
        run: python fetch_modera.py
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/snapshots.json data/henry-snapshots.json data/modera-snapshots.json
          git diff --staged --quiet || git commit -m "Daily unit snapshot $(date -u +'%Y-%m-%d')"
          git push
